name: Test setup package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: "Also run the full install on a clean macOS machine"
        type: boolean
        default: true
  schedule:
    # Mondays: catches apps that were renamed or removed from Homebrew.
    - cron: "17 11 * * 1"

# The test runs only read this repository.
permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux, fast)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: sudo apt-get install -y shellcheck zsh tmux jq
      - run: bash tests/run-all.sh

  macos-checks:
    name: Checks with macOS bash 3.2
    runs-on: macos-26
    env:
      # Put Apple's /bin/bash 3.2 ahead of Homebrew's bash 5, as on a new Mac.
      PATH: /usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin
    steps:
      - uses: actions/checkout@v5
      - run: brew install shellcheck jq tmux
      - run: bash --version | head -1 && /bin/bash tests/run-all.sh

  full-install:
    name: Full install on a clean Mac (${{ matrix.image }})
    # macOS minutes are limited on private repositories, so this runs on
    # request (Actions tab, "Run workflow") and weekly.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_install)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 is GitHub's macOS 27 image, the version the new Mac runs.
        image: [xcode-27, macos-26]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 120
    env:
      MAC_SETUP_HOME: ${{ github.workspace }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@v5
      - name: Run 1, full setup
        run: /bin/bash setup.sh --ci --skip r-packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # only for ArtCraft release lookups
      - name: Report what was installed
        if: always()
        run: |
          echo "::notice title=installed::$(brew list --cask -1 | wc -l | tr -d ' ') casks, $(brew list --formula -1 | wc -l | tr -d ' ') formulae, $(ls /Applications | wc -l | tr -d ' ') apps in /Applications"
          echo "::notice title=disk::$(du -sh /Applications 2>/dev/null | cut -f1) in /Applications"
          # Which file types each ArtCraft app tells macOS it can open.
          for app in /Applications/*Craft.app; do
            [ -d "$app" ] || continue
            types=$(plutil -convert json -o - "$app/Contents/Info.plist" | jq -c '[.CFBundleDocumentTypes[]? | (.CFBundleTypeExtensions // []) + (.LSItemContentTypes // [])] | flatten')
            echo "::notice title=filetypes $(basename "$app")::id $(defaults read "$app/Contents/Info" CFBundleIdentifier) declares $types"
          done
      - name: Check the installed machine
        run: /bin/bash tests/verify-install.sh --ci
      - name: Run 2, setup again must succeed and change nothing
        run: |
          /bin/bash setup.sh --ci --skip r-packages 2>&1 | tee run2.log
          if grep -E "Linked |Backed up |moved to the Trash|Installed [A-Z]|Caps Lock shortcuts updated" run2.log; then
            echo "::error title=repeat::The second run changed things (lines above)"; exit 1
          fi
      - name: R packages
        run: /bin/bash setup.sh --ci --only r-packages
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: setup-logs
          path: ~/Library/Logs/mac-setup/
