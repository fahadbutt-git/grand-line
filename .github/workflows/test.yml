name: Test setup package

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_install:
        description: "Also run the full install on a clean macOS machine"
        type: boolean
        default: true
  schedule:
    # Mondays: catches apps that were renamed or removed from Homebrew.
    - cron: "17 11 * * 1"

# The test runs only read this repository. Each job asks for no more.
# Actions are pinned to a commit (the version is in the comment beside it),
# so a moved tag cannot change what runs; tests/security-checks.sh --actions
# checks it.
permissions:
  contents: read

jobs:
  checks:
    name: Checks (Linux, fast)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: sudo apt-get install -y shellcheck zsh tmux jq
      - name: Security checks (keys and tokens, pinned actions, downloaded code, entitlements)
        run: bash tests/security-checks.sh
      - run: bash tests/run-all.sh

  macos-checks:
    name: Checks with macOS bash 3.2
    runs-on: macos-26
    permissions:
      contents: read
    env:
      # Put Apple's /bin/bash 3.2 ahead of Homebrew's bash 5, as on a new Mac.
      PATH: /usr/bin:/bin:/usr/sbin:/sbin:/opt/homebrew/bin
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - run: brew install shellcheck jq tmux
      - run: bash --version | head -1 && /bin/bash tests/run-all.sh

  apps:
    name: Apps, build and test (${{ matrix.app }}, macOS 27)
    runs-on: xcode-27
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        app: [finder, iceberg]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build and test
        env:
          APP: ${{ matrix.app }}
        run: |
          set -o pipefail
          if [ ! -f "apps/$APP/Package.swift" ]; then echo "::notice title=$APP::no app yet"; exit 0; fi
          cd "apps/$APP"
          swift --version | head -1
          if ! swift build 2>&1 | tee build.log; then
            grep -E "error:" build.log | head -40 | sed "s/^/::error title=$APP build::/"; exit 1
          fi
          grep -E "warning:" build.log | sort -u | head -20 | sed "s/^/::warning title=$APP build::/"
          if ! swift test 2>&1 | tee test.log; then
            grep -E "error:|failed|XCTAssert" test.log | head -60 | sed "s/^/::error title=$APP test::/"; exit 1
          fi
          echo "::notice title=$APP tests::$(grep -Eo 'Executed [0-9]+ tests?, with [0-9]+ failures?' test.log | tail -1)"
          # The new Mac has only the command line tools, so build with them too.
          if [ -d /Library/Developer/CommandLineTools ]; then
            if ! DEVELOPER_DIR=/Library/Developer/CommandLineTools swift build -c release 2>&1 | tee clt.log; then
              grep -E "error:" clt.log | head -20 | sed "s/^/::error title=$APP command line tools::/"; exit 1
            fi
            echo "::notice title=$APP::builds with the command line tools alone"
          fi
          # The app bundles, made exactly as setup makes them (lib/native-apps.sh).
          cd "$GITHUB_WORKSPACE"
          export GRAND_LINE_APPS_DEST="$RUNNER_TEMP/apps" REPO_DIR="$GITHUB_WORKSPACE" DRY_RUN=0
          mkdir -p "$GRAND_LINE_APPS_DEST"
          if ! bash -c 'source lib/common.sh && source lib/native-apps.sh && build_and_install "apps/$APP"' 2>&1 | tee release.log; then
            grep -E "error:|!" release.log | head -20 | sed "s/^/::error title=$APP bundle::/"; exit 1
          fi
          [ -f "apps/$APP/apps.tsv" ] || exit 0
          for app in "$GRAND_LINE_APPS_DEST"/*.app; do
            plutil -lint "$app/Contents/Info.plist" >/dev/null && codesign --verify --deep "$app" \
              && echo "::notice title=$APP bundle::$(basename "$app") built and signed" \
              || { echo "::error title=$APP bundle::$(basename "$app") is not a valid signed app"; exit 1; }
          done
          # Hardened runtime on, nothing that weakens it in the entitlements.
          if ! out="$(bash tests/security-checks.sh --bundles "$GRAND_LINE_APPS_DEST")"; then
            echo "::error title=$APP hardened runtime::$(printf '%s' "$out" | tr '\n' ' ')"; exit 1
          fi

  journeys:
    name: User journeys, every app driven like a person (macOS 27)
    runs-on: xcode-27
    permissions:
      contents: read
    # Hard stop; each step and the driver have their own, shorter limits.
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the app bundles and the journey driver
        id: build
        timeout-minutes: 25
        run: |
          set -o pipefail
          APPS_OUT="$RUNNER_TEMP/apps" RESULTS="$RUNNER_TEMP/journeys"
          printf 'APPS_OUT=%s\nRESULTS=%s\n' "$APPS_OUT" "$RESULTS" >> "$GITHUB_ENV"
          export GRAND_LINE_APPS_DEST="$APPS_OUT" REPO_DIR="$GITHUB_WORKSPACE" DRY_RUN=0
          mkdir -p "$APPS_OUT" "$RESULTS"
          # The app folders come from the journeys' own list of apps.
          for folder in $(grep -v '^#' tests/journeys/apps.tsv | cut -f2 | sort -u); do
            if ! bash -c 'source lib/common.sh && source lib/native-apps.sh && build_and_install "$1"' _ "$folder" 2>&1 | tee build.log; then
              echo "::error title=journeys build $folder::$(grep -E 'error:' build.log | head -20 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')"; exit 1
            fi
          done
          ls "$APPS_OUT"
          bash tests/security-checks.sh --bundles "$APPS_OUT" || exit 1
          if ! swift build -c release --package-path tests/journeys 2>&1 | tee driver.log; then
            echo "::error title=journey driver build::$(grep -E 'error:' driver.log | head -20 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')"; exit 1
          fi
          echo "DRIVER=$(swift build -c release --package-path tests/journeys --show-bin-path)/journeys" >> "$GITHUB_ENV"
      - name: Allow the driver to use Accessibility and record the screen
        timeout-minutes: 5
        run: |
          # Sight switches dark mode, the Dock and the menu bar through System
          # Events, so it gets Automation too (a prompt would block it here).
          bash tests/journeys/grant-tcc.sh --automation "$APPS_OUT/Sight.app" "$DRIVER"
          if "$DRIVER" --check-permissions; then
            echo "::notice title=journeys permissions::Accessibility and Screen Recording granted"
          else
            echo "::warning title=journeys permissions::$("$DRIVER" --check-permissions | tr '\n' ' '); the journeys report what this stops"
          fi
      - name: Link the package where the apps look for its commands
        # Sight runs ~/.grand-line/bin/toggle, power and the rest, as setup
        # links them on a real Mac; without the link every settings action
        # would fail here for that reason alone.
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.grand-line"
      - name: "Journeys: the files app"
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 15
        run: >-
          "$DRIVER" --apps "$APPS_OUT" --fixture-script tests/journeys/make-fixture.sh
          --out "$RESULTS" --only files --github --total-timeout 840
      - name: "Journeys: the launcher"
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 15
        run: >-
          "$DRIVER" --apps "$APPS_OUT" --fixture-script tests/journeys/make-fixture.sh
          --out "$RESULTS" --only launcher --github --total-timeout 840
      - name: "Journeys: the notch app"
        if: always() && steps.build.outcome == 'success'
        timeout-minutes: 10
        run: >-
          "$DRIVER" --apps "$APPS_OUT" --fixture-script tests/journeys/make-fixture.sh
          --out "$RESULTS" --only notch --github --total-timeout 540
      - name: No app stalled its main thread for over a second
        if: always() && steps.build.outcome == 'success'
        # Each app's hang watchdog writes "main thread stalled N ms" to its
        # log in the fixture home (~/Library/Logs/grand-line).
        run: |
          [ -d "$RESULTS/homes" ] || exit 0
          worst=0; where=""
          while IFS= read -r line; do
            ms="$(printf '%s' "$line" | sed -n 's/.*main thread stalled \([0-9]*\) ms.*/\1/p')"
            [ -n "$ms" ] || continue
            echo "::notice title=main-thread stall::$line"
            if [ "$ms" -gt "$worst" ]; then worst="$ms"; where="$line"; fi
          done < <(grep -rH "main thread stalled" "$RESULTS"/homes/*/journeyhome/Library/Logs/grand-line/ 2>/dev/null || true)
          if [ "$worst" -gt 1000 ]; then echo "::error title=main-thread stall::$where"; exit 1; fi
          echo "::notice title=main-thread stalls::longest ${worst} ms"
      - name: Zip the screenshots
        if: always()
        run: |
          [ -d "$RESULTS" ] || exit 0
          # The fixture homes are rebuilt each run; only the pictures and results
          # are kept. They are left out of the zip rather than removed: a journey
          # leaves locked files there (the data-safety checks) that rm refuses.
          name="$(basename "$RESULTS")"
          cd "$(dirname "$RESULTS")" && zip -qr journeys.zip "$name" -x "$name/homes/*"
      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: journey-screenshots
          path: ${{ runner.temp }}/journeys.zip
          if-no-files-found: ignore

  budgets:
    name: Resource budgets (macOS 27)
    runs-on: xcode-27
    permissions:
      contents: read
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the app bundles
        id: build
        timeout-minutes: 25
        run: |
          set -o pipefail
          APPS_OUT="$RUNNER_TEMP/apps" PERF_OUT="$RUNNER_TEMP/perf"
          printf 'APPS_OUT=%s\nPERF_OUT=%s\n' "$APPS_OUT" "$PERF_OUT" >> "$GITHUB_ENV"
          export GRAND_LINE_APPS_DEST="$APPS_OUT" REPO_DIR="$GITHUB_WORKSPACE" DRY_RUN=0
          mkdir -p "$APPS_OUT" "$PERF_OUT"
          # The same app folders and build as the journeys job.
          for folder in $(grep -v '^#' tests/journeys/apps.tsv | cut -f2 | sort -u); do
            if ! bash -c 'source lib/common.sh && source lib/native-apps.sh && build_and_install "$1"' _ "$folder" 2>&1 | tee build.log; then
              echo "::error title=budgets build $folder::$(grep -E 'error:' build.log | head -20 | awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}')"; exit 1
            fi
          done
          ls "$APPS_OUT"
      - name: The shell tools the package's zsh lines load
        run: brew install starship zoxide fzf mise eza || echo "::warning title=budgets::some shell tools did not install; shell startup is measured without them"
      - name: Allow the measuring script to type and read back through System Events
        timeout-minutes: 5
        run: bash tests/journeys/grant-tcc.sh --automation "$APPS_OUT/Sight.app" /usr/bin/osascript
      - name: Link the package where the apps look for its commands
        run: ln -sfn "$GITHUB_WORKSPACE" "$HOME/.grand-line"
      - name: Measure idle, bursts, focus, shell startup and launch agents
        if: steps.build.outcome == 'success'
        timeout-minutes: 30
        run: bash tests/perf/run.sh --apps "$APPS_OUT" --out "$PERF_OUT"
      - name: Keep the measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resource-budgets
          path: ${{ runner.temp }}/perf/results
          if-no-files-found: ignore

  full-install:
    name: Full install on a clean Mac (${{ matrix.image }})
    # macOS minutes are limited on private repositories, so this runs on
    # request (Actions tab, "Run workflow") and weekly.
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.full_install)
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        # xcode-27 is GitHub's macOS 27 image, the version the new Mac runs.
        image: [xcode-27, macos-26]
    runs-on: ${{ matrix.image }}
    permissions:
      contents: read
    timeout-minutes: 120
    env:
      GRAND_LINE_HOME: ${{ github.workspace }}
      HOMEBREW_NO_INSTALL_CLEANUP: 1
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The token is only for ArtCraft's release lookups (GitHub's rate limit),
      # so only that step gets it. The rest of the install runs Homebrew's and
      # each app's own installers, which never see it.
      - name: Run 1a, ArtCraft apps
        run: /bin/bash setup.sh --ci --only artcraft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run 1b, full setup
        run: /bin/bash setup.sh --ci --skip r-packages,artcraft
      - name: Report what was installed
        if: always()
        run: |
          echo "::notice title=installed::$(brew list --cask -1 | wc -l | tr -d ' ') casks, $(brew list --formula -1 | wc -l | tr -d ' ') formulae, $(ls /Applications | wc -l | tr -d ' ') apps in /Applications"
          echo "::notice title=disk::$(du -sh /Applications 2>/dev/null | cut -f1) in /Applications"
          # Which file types each ArtCraft app tells macOS it can open.
          for app in /Applications/*Craft.app; do
            [ -d "$app" ] || continue
            types=$(plutil -convert json -o - "$app/Contents/Info.plist" | jq -c '[.CFBundleDocumentTypes[]? | (.CFBundleTypeExtensions // []) + (.LSItemContentTypes // [])] | flatten')
            echo "::notice title=filetypes $(basename "$app")::id $(defaults read "$app/Contents/Info" CFBundleIdentifier) declares $types"
          done
      - name: Check the installed machine
        run: /bin/bash tests/verify-install.sh --ci
      - name: Run 2, setup again must succeed and change nothing
        run: |
          # Written to a file rather than piped, so a helper that keeps the
          # output open cannot hold the step. If the run stalls for 15 minutes, the last
          # lines and the processes still going are shown before stopping.
          /bin/bash setup.sh --ci --skip r-packages > run2.log 2>&1 &
          pid=$!
          for _ in $(seq 1 90); do kill -0 "$pid" 2>/dev/null || break; sleep 10; done
          if kill -0 "$pid" 2>/dev/null; then
            # One annotation each, since a step shows at most ten.
            enc() { awk 'BEGIN{ORS="%0A"} {gsub(/%/,"%25"); print}'; }
            echo "::error title=run 2 stalled, last lines::$(tail -n 30 run2.log | sed 's/\x1b\[[0-9;]*m//g' | enc)"
            echo "::error title=run 2 stalled, still running::$(ps -axo pid,ppid,etime,command | awk 'NR > 1 && $3 !~ /-/ && $3 !~ /:.*:/' | grep -vE 'ps -axo|awk ' | cut -c1-200 | tail -n 40 | enc)"
            kill "$pid"; exit 1
          fi
          status=0; wait "$pid" || status=$?
          cat run2.log
          lsof run2.log 2>/dev/null | tail -n +2 | while IFS= read -r l; do echo "::warning title=holds the output::$l"; done
          [ "$status" -eq 0 ] || exit "$status"
          if grep -E "Linked |Backed up |moved to the Trash|Installed [A-Z]|Caps Lock shortcuts updated" run2.log; then
            echo "::error title=repeat::The second run changed things (lines above)"; exit 1
          fi
      - name: R packages
        run: /bin/bash setup.sh --ci --only r-packages
      - name: Keep the logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: setup-logs
          path: ~/Library/Logs/grand-line/
