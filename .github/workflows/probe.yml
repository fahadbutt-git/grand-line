name: Probe runner images
on: workflow_dispatch
jobs:
  probe:
    strategy:
      matrix:
        image: [macos-26, xcode-27]
    runs-on: ${{ matrix.image }}
    steps:
      - run: |
          echo "::notice title=${{ matrix.image }}::macOS $(sw_vers -productVersion) build $(sw_vers -buildVersion), $(tar --version | head -1), jq $(/usr/bin/jq --version 2>&1)"
