name: Apps download

# Builds Nexus, Sight and Iceberg exactly as setup does and publishes
# them as a download on the run's page (signed-in GitHub users only), so
# they can be tried on any Mac without running setup.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["apps/**", "lib/native-apps.sh"]

permissions:
  contents: read

concurrency:
  group: apps-download
  cancel-in-progress: true

jobs:
  publish:
    runs-on: xcode-27
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - name: Build the apps
        run: |
          export GRAND_LINE_APPS_DEST="$RUNNER_TEMP/apps" REPO_DIR="$GITHUB_WORKSPACE" DRY_RUN=0
          mkdir -p "$GRAND_LINE_APPS_DEST"
          for dir in apps/*/; do
            [ -f "$dir/apps.tsv" ] || continue
            bash -c 'source lib/common.sh && source lib/native-apps.sh && build_and_install "$1"' _ "${dir%/}"
          done
          cd "$GRAND_LINE_APPS_DEST"
          for app in *.app; do codesign --verify --deep "$app"; done
          bash "$GITHUB_WORKSPACE/tests/security-checks.sh" --bundles "$GRAND_LINE_APPS_DEST"
          # Zipped with ditto first: the artifact upload drops the executable
          # bit and the framework symlinks an app needs to open.
          mkdir -p "$RUNNER_TEMP/out"
          cat > "$GRAND_LINE_APPS_DEST/Read me first.txt" <<'TXT'
          These apps are signed but not notarized by Apple, so macOS blocks a copy
          downloaded in a browser ("Apple could not verify..."). Move them to
          Applications, then run this once in Terminal:

              xattr -dr com.apple.quarantine /Applications/Nexus.app /Applications/Sight.app /Applications/Iceberg.app "/Applications/Grand Line Index.app"

          These copies do not update themselves. The standard installation builds
          the apps on the Mac instead, which macOS never blocks, and keeps them up
          to date:

              git clone https://github.com/fahadbutt-git/grand-line.git ~/grand-line
              bash ~/grand-line/setup.sh

          See "On the new Mac" in the README.
          TXT
          ditto -c -k --keepParent "$GRAND_LINE_APPS_DEST" "$RUNNER_TEMP/out/Grand-Line-apps.zip"
          echo "::notice title=apps::$(ls -1 | tr '\n' ' ')"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Grand-Line-apps
          path: ${{ runner.temp }}/out/Grand-Line-apps.zip
          retention-days: 30
