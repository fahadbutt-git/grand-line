# AeroSpace: tiling windows, as in Omarchy.
# Shortcuts live in Karabiner (Caps Lock layer) and call the aerospace
# command, so all keys are defined in one place: tools/bindings.py.

config-version = 2

start-at-login = true
auto-reload-config = true
persistent-workspaces = ["1", "2", "3", "4", "5", "6", "7", "8", "9"]

enable-normalization-flatten-containers = true
enable-normalization-opposite-orientation-for-nested-containers = true

accordion-padding = 30
default-root-container-layout = 'tiles'
default-root-container-orientation = 'auto'

on-focused-monitor-changed = ['move-mouse monitor-lazy-center']
automatically-unhide-macos-hidden-apps = false

[key-mapping]
preset = 'qwerty'

[gaps]
inner.horizontal = 10
inner.vertical = 10
outer.left = 10
outer.bottom = 10
outer.top = 10
outer.right = 10

[mode.main.binding]
# Intentionally empty. See config/karabiner/karabiner.json.

# Small utility windows float instead of tiling.
[[on-window-detected]]
if.app-id = 'com.apple.systempreferences'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.ActivityMonitor'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'org.p0deje.Maccy'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'theboringteam.boringnotch'
run = 'layout floating'

[[on-window-detected]]
if.app-id = 'com.apple.finder'
run = 'layout floating'

# Each kind of app opens on its own workspace, so Caps + number always finds it.
#   1 browser   2 terminal and code   3 AI   4 writing   5 research and data
#   6 notes     7 media               8 kept empty: the desktop dashboard
#   9 communication
# Change a number here and it takes effect at once. Delete a block to let
# that app open wherever you are.

[[on-window-detected]]
if.app-id = 'com.google.Chrome'
