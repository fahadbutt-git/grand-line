# Prompt: folder, git branch and status, and how long a slow command took.
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
truncation_length = 3

[git_branch]
format = "$branch "

[git_status]

[cmd_duration]
min_time = 2000
format = "$duration "

[character]
success_symbol = "›"
error_symbol = "›"
