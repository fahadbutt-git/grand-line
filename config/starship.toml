# Prompt: folder, git branch and status, and how long a slow command took.
add_newline = true
format = "$directory$git_branch$git_status$cmd_duration$line_break$character"

[directory]
truncation_length = 3
style = "bold blue"

[git_branch]
format = "[$branch]($style) "
style = "purple"

[git_status]
style = "red"

[cmd_duration]
min_time = 2000
format = "[$duration]($style) "

[character]
success_symbol = "[›](bold green)"
error_symbol = "[›](bold red)"
