# Text shortcuts. Type the trigger anywhere and it is replaced.
# Add your own in this file or in base.yml next to it. Espanso reloads on save.
matches:
  # Dates in the formats manuscripts, forms and file names use.
  - trigger: ";date"
    replace: "{{d}}"
    vars: [{ name: d, type: date, params: { format: "%B %-d, %Y" } }]
  - trigger: ";iso"
    replace: "{{d}}"
    vars: [{ name: d, type: date, params: { format: "%Y-%m-%d" } }]
  - trigger: ";time"
    replace: "{{t}}"
    vars: [{ name: t, type: date, params: { format: "%H:%M" } }]

  # Email. ;br and ;sig use your own name and signature, so setup writes them
  # from ~/.config/grand-line/personal.env into personal.yml beside this file.
  - trigger: ";ty"
    replace: "Thank you for your time and consideration."

  # Research.
  - trigger: ";ci"
    replace: "95% CI"
  - trigger: ";sd"
    replace: "mean (SD)"
